name: Publish saved reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reports/allure-html/**
      - .github/workflows/publish-reports.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare saved Allure snapshot
        run: |
          mkdir -p _site/allure
          cp -R reports/allure-html/. _site/allure/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><title>API automation reports</title><meta http-equiv="refresh" content="0;url=allure/"><a href="allure/">Open saved Allure regression report</a></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy reports
        id: deployment
        uses: actions/deploy-pages@v4
